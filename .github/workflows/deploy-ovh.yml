name: Deploy ATELIER 7S to OVH

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "atelier.css"
      - "atelier-2026-v3.css"
      - "v2.css"
      - "v2-adjustments.css"
      - "assets/**"
      - "ia-art-studio/**"
      - "cv/**"
      - "robots.txt"
      - "sitemap.xml"
      - ".github/workflows/deploy-ovh.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate public site
        run: |
          test -f index.html
          test -f atelier-2026-v3.css
          test -f ia-art-studio/index.html
          test -f ia-art-studio/free/index.html
          test -f cv/index.html
          test -f cv/cv.css
          test -f cv/cv.js

      - name: Check OVH credentials
        env:
          OVH_FTP_SERVER: ${{ secrets.OVH_FTP_SERVER }}
          OVH_FTP_USERNAME: ${{ secrets.OVH_FTP_USERNAME }}
          OVH_FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          test -n "$OVH_FTP_SERVER"
          test -n "$OVH_FTP_USERNAME"
          test -n "$OVH_FTP_PASSWORD"

      - name: Deploy to OVH
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.OVH_FTP_SERVER }}
          username: ${{ secrets.OVH_FTP_USERNAME }}
          password: ${{ secrets.OVH_FTP_PASSWORD }}
          local-dir: ./
          server-dir: www/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            **/README.md
            **/ARCHITECTURE.md
            **/CHANGELOG.md
            **/COMMIT_CONVENTION.md
            **/CONTRIBUTING.md
            **/PUBLICATION.md
            **/SECURITY.md
            ai-process-studio/**
            h9-factory/**
            visual-ai-studio/**
            infographic-lab/**
            ia-art/**
            preview-v3/**


      - name: Post-deploy HTTP diagnostics
        run: |
          for url in             "https://7-sens.fr/"             "https://7-sens.fr/cv/"             "https://7-sens.fr/cv/index.html"             "https://etorrent-org.github.io/cv/"; do
            code=$(curl -L -sS -o /dev/null -w "%{http_code}" "$url" || true)
            echo "$code $url"
          done
