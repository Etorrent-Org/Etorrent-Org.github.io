name: Deploy 7S Preview V3

on:
  push:
    branches:
      - feature/refonte-7-sens-2026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    env:
      OVH_FTP_SERVER: ${{ secrets.OVH_FTP_SERVER }}
      OVH_FTP_USERNAME: ${{ secrets.OVH_FTP_USERNAME }}
      OVH_FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate preview
        run: |
          test -f index.html
          test -f atelier-2026-v3.css
          test -f assets/atelier7s/ia-art-studio.webp
          test -f ia-art-studio/index.html

      - name: Check OVH credentials
        if: ${{ env.OVH_FTP_SERVER == '' || env.OVH_FTP_USERNAME == '' || env.OVH_FTP_PASSWORD == '' }}
        run: |
          echo "OVH FTP credentials are missing."
          exit 1

      - name: Deploy preview to OVH
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.OVH_FTP_SERVER }}
          username: ${{ secrets.OVH_FTP_USERNAME }}
          password: ${{ secrets.OVH_FTP_PASSWORD }}
          local-dir: ./
          server-dir: public_html/preview-v3/
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            **/README.md
            **/ARCHITECTURE.md
            **/CHANGELOG.md
            **/COMMIT_CONVENTION.md
            **/CONTRIBUTING.md
            **/PUBLICATION.md
            **/SECURITY.md
            ai-process-studio/**
            h9-factory/**
            visual-ai-studio/**
            infographic-lab/**
