name: Patch Infographic Lab page

on:
  push:
    branches:
      - docs/infographic-lab-overview
    paths:
      - '.github/workflows/patch-infographic-lab-page.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/infographic-lab-overview
      - name: Insert overview infographic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('infographic-lab/index.html')
          s = p.read_text(encoding='utf-8')
          if 'infographic-lab-overview.svg' not in s:
              css_marker = '    .lead{max-width:780px;margin:20px 0 0;color:var(--muted);font-size:18px;line-height:1.7}\n'
              css_add = css_marker + '    .infographic-frame{margin-top:38px;padding:20px;border:1px solid var(--line);border-radius:28px;background:#fbf8f0;box-shadow:var(--shadow)}\n    .infographic-frame img{display:block;width:100%;height:auto;border-radius:18px}\n'
              if css_marker not in s:
                  raise SystemExit('CSS marker not found')
              s = s.replace(css_marker, css_add, 1)

              nav_old = '<div class="nav-links"><a href="#fonctionnalites">Fonctionnalités</a><a href="#visuels">Visuels</a><a href="#installation">Installation</a><a class="nav-cta" href="https://github.com/Etorrent-Org/infographic-lab">Voir le code</a></div>'
              nav_new = '<div class="nav-links"><a href="#vue-ensemble">Vue d’ensemble</a><a href="#fonctionnalites">Fonctionnalités</a><a href="#visuels">Visuels</a><a href="#installation">Installation</a><a class="nav-cta" href="https://github.com/Etorrent-Org/infographic-lab">Voir le code</a></div>'
              if nav_old not in s:
                  raise SystemExit('Nav marker not found')
              s = s.replace(nav_old, nav_new, 1)

              section_marker = '    <section class="product-section" id="fonctionnalites">\n'
              section = '''    <section class="product-section" id="vue-ensemble">\n      <p class="eyebrow">Vue d’ensemble</p>\n      <h2>Du texte au visuel, avec une IA cadrée.</h2>\n      <p class="lead">L’infographie résume la chaîne de valeur : décrire l’idée, structurer avec Vibe, valider le JSON, construire le visuel localement, garder la main sur l’édition puis sauvegarder et exporter.</p>\n      <div class="infographic-frame"><img src="https://raw.githubusercontent.com/Etorrent-Org/infographic-lab/main/docs/images/infographic-lab-overview.svg" alt="Infographie du workflow Infographic Lab"></div>\n    </section>\n\n'''
              if section_marker not in s:
                  raise SystemExit('Section marker not found')
              s = s.replace(section_marker, section + section_marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/patch-infographic-lab-page.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- infographic-lab/index.html .github/workflows/patch-infographic-lab-page.yml
          git commit -m "Us and Them - ajoute l'infographie Infographic Lab à la page publique"
          git push origin HEAD:docs/infographic-lab-overview
